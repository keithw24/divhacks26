name: Deployment CI

# Checks only what ships: the MVP agent (mvp/, deployed to the droplet) and the website (frontend/).
# deploy-droplet.yml runs after this workflow succeeds on main, so keep this name.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  mvp:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mvp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mvp/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: docker build --tag around-me-mvp:test .
      - run: cp .env.example .env && docker compose -f compose.yaml config --quiet

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.22
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run build
