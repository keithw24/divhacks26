name: boroughos

services:
  agent:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      WEB_API_HOST: 0.0.0.0
      WEB_API_PORT: 8080
      WEB_ALLOWED_ORIGINS: https://${DOMAIN:?Set DOMAIN in .env}
      AGENT_STATE_PATH: /app/data/agent-state.json
      WEB_STATE_PATH: /app/data/web-users.json
    volumes:
      - agent_data:/app/data
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_AGENT_API_URL: ""
        VITE_AGENT_NUMBER: ${AGENT_NUMBER:-}
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: 3000
    expose:
      - "3000"

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on:
      agent:
        condition: service_healthy
      frontend:
        condition: service_started
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  migrate:
    build:
      context: .
      dockerfile: Dockerfile.ingest
    profiles: ["tools"]
    env_file: .env
    entrypoint: ["sh", "-c"]
    command:
      - >-
        for file in /app/sql/*.sql; do
          echo "Applying $${file}";
          psql "$${DATABASE_URL}" -v ON_ERROR_STOP=1 -f "$${file}";
        done

  ingest:
    build:
      context: .
      dockerfile: Dockerfile.ingest
    profiles: ["tools"]
    env_file: .env

volumes:
  agent_data:
  caddy_data:
  caddy_config:
